name: vitalize
description: "Vitalize: tập gym theo bản đồ cơ, hình động từng bài, ăn uống theo mục tiêu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  permission_handler: ^13.0.2
  image_picker: ^1.2.4
  wakelock_plus: ^1.8.1
  url_launcher: ^6.3.3
  path_drawing: ^1.0.1
  # One FlutterFire release (15 Oct 2026): on iOS each plugin pins the same firebase-ios-sdk, so
  # they move together. Held here until fake_cloud_firestore (tests) supports cloud_firestore 7.1.
  firebase_core: 5.0.0
  firebase_auth: 7.0.0
  cloud_firestore: 7.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0
  # fake_cloud_firestore 4.4 predates platform interface 8.1 (FieldValue.minimum/maximum).
  cloud_firestore_platform_interface: '>=8.0.7 <8.1.0'

dependency_overrides:
  # google_sign_in_ios 6.3.8 pins GoogleSignIn-iOS 9, which needs gtm-session-fetcher 3.x while
  # firebase-ios-sdk 13 needs 4.x, so the iOS build can't resolve. This copy only moves it to
  # GoogleSignIn-iOS 10 (same API, iOS 15+); drop it once the plugin itself does.
  google_sign_in_ios:
    path: third_party/google_sign_in_ios

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  # Bundled, not fetched: the app works offline in the gym basement.
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt-SemiBold.ttf
          weight: 600
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
